[project]
name = "misroute"
version = "0.3.1"
description = "Find the tools your agent confuses and test whether a fix helps, against a neutral edit"
authors = [
    { name = "philippyt", email = "philipaha@proton.me" }
]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "agents", "llm", "tool-use", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=2.3.0",
    "duckdb>=2.0.0",
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "openai>=3.41.0",
    "pydantic>=2.14.2",
    "pydantic-monty>=1.4.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "truststore>=0.10.5",
    "typer>=0.27.3",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.45.2",
]
azure = [
    "azure-identity>=1.27.0",
]

[project.scripts]
misroute = "misroute.cli:app"

[project.entry-points.pytest11]
misroute = "misroute.testing.plugin"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.isort]
no-lines-before = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs a running model endpoint", "fastmcp: runs a generated server with fastmcp from PyPI"]
addopts = "-m 'not live and not fastmcp'"

[tool.ty.environment]
python-version = "3.11"
